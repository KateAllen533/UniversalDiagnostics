[build]
  # Install dependencies (including devDependencies for build)
  # Use npm install instead of npm ci to ensure devDependencies are installed
  command = "npm install && npm run build:netlify"
  # Publish directory (where the static files are output)
  publish = "dist"
  
  # Environment variables
  [build.environment]
    NODE_VERSION = "20"
    NETLIFY = "true"
    # Don't set NODE_ENV=production during install, only during build
    NPM_CONFIG_PRODUCTION = "false"

# SPA redirect rules - all routes redirect to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

